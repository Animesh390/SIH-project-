<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Faculty Complaints Portal</title>
  <style>
    :root{--bg:#f4f7fb;--card:#ffffff;--accent:#2b6cb0;--muted:#6b7280}
    *{box-sizing:border-box}
    body{font-family:Inter,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);margin:0;padding:20px;color:#0f172a}
    .container{max-width:800px;margin:0 auto}

    header{display:flex;align-items:center;gap:16px;margin-bottom:18px}
    header .logo{width:56px;height:56px;border-radius:8px;background:linear-gradient(135deg,#4f46e5,#06b6d4);display:flex;align-items:center;justify-content:center;color:white;font-weight:700}
    header h1{font-size:20px;margin:0}
    header p{margin:0;color:var(--muted);font-size:13px}

    .card{background:var(--card);padding:16px;border-radius:12px;box-shadow:0 6px 18px rgba(15,23,42,0.06);margin-bottom:16px}
    ul.complaints{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
    .complaint{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:10px;border:1px solid #eef2f6;background:var(--card)}
    .meta{flex:1}
    .meta h3{margin:0;font-size:15px}
    .meta p{margin:6px 0;color:var(--muted);font-size:13px}
    .meta .info{font-size:12px;color:#475569}
    .ctrls{display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center}
    .tick{font-size:20px;color:#10b981}
    .small{font-size:12px;padding:6px 8px;border-radius:8px;border:0;cursor:pointer}
    .btn-resolve{background:#10b981;color:white}

    .empty{padding:30px;text-align:center;color:var(--muted)}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo"><img src="accuratelogo.png" alt="College Logo" style="width:100%;height:100%;object-fit:contain;border-radius:8px"/></div>
      <div style="flex:1">
        <h1>Faculty Complaints Portal</h1>
        <p>View and resolve complaints posted by students.</p>
      </div>
    </header>

    <section class="card">
      <h3 style="margin:0 0 10px 0">Complaints</h3>
      <ul class="complaints" id="complaintsList"></ul>
      <div id="emptyState" class="empty" style="display:none">No complaints yet.</div>
    </section>
  </div>

  <script>
    const STORAGE_KEY = 'college_complaints_simple';
    const complaintsList = document.getElementById('complaintsList');
    const emptyState = document.getElementById('emptyState');
    let complaints = [];

    function load() {
      const raw = localStorage.getItem(STORAGE_KEY);
      complaints = raw ? JSON.parse(raw) : [];
      render();
    }

    function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(complaints)); }

    function render(){
      complaintsList.innerHTML = '';
      if(complaints.length===0){ emptyState.style.display='block'; return; }
      else { emptyState.style.display='none'; }

      complaints.forEach(c => {
        const li = document.createElement('li'); li.className='complaint';
        li.innerHTML = `
          <div class="meta">
            <h3>${escapeHtml(c.subject)}</h3>
            <div class="info">${escapeHtml(c.author)} • ${formatDate(c.createdAt)}</div>
            <p>${escapeHtml(c.details)}</p>
          </div>
          <div class="ctrls">
            ${c.resolved 
              ? '<span class="tick">&#10004;</span>'
              : `<button class="small btn-resolve" data-id="${c.id}">Resolve</button>`}
          </div>
        `;
        complaintsList.appendChild(li);
      });
    }

    complaintsList.addEventListener('click', (e)=>{
      const btn = e.target.closest('.btn-resolve'); if(!btn) return;
      const id = btn.dataset.id;
      const idx = complaints.findIndex(c=>c.id===id); if(idx===-1) return;
      complaints[idx].resolved = true; save(); render();
    });

    function escapeHtml(s){ if(!s) return ''; return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;'); }
    function formatDate(iso){ const d=new Date(iso); return d.toLocaleString(); }

    load();
    window.addEventListener('storage', (e)=>{ if(e.key===STORAGE_KEY) load(); });
  </script>
</body>
</html>
